<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="icon" href="./img/logoo.png">

    <link rel="stylesheet" type="text/css" href="./iofrm_files/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="./iofrm_files/fontawesome-all.min.css">
    <link rel="stylesheet" type="text/css" href="./iofrm_files/iofrm-style.css">
    <link rel="stylesheet" type="text/css" href="./iofrm_files/iofrm-theme41.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Abel&family=Almarai:wght@300;400;700;800&family=Cairo:wght@200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Cairo", serif !important;
            overflow-y: hidden;
        }

        ::-webkit-scrollbar {
            background-color: #ccc !important;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #e1b13e !important;
        }

        input[type="text"],
        input.form-control {
            text-align: right;
            direction: rtl;
        }

        .img-holder {
            width: 50%;
            height: 100vh;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5%;
            margin-bottom: 100px;
            margin-top: -200px;
        }

        .form-holder {
            margin-bottom: 500px;
        }

        .img-holder {
            display: block;
        }

        @media screen and (max-width : 1024px) {
            .img-holder {
                display: none !important;
            }
        }

        #login-form input {
            border-radius: 50px;
            padding: 10px 20px;
        }

        .input-box {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
        }

        .input-box input {
            width: 112%;
            padding: 12px 45px 12px 40px !important;
            /* مسافة من اليسار للأيقونة */
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
            text-align: right;
            /* جعل النصوص داخل الحقل تبدأ من اليمين */
        }

        .input-box input:hover {
            border: 2px solid #ccc;

        }

        .input-box input:focus {
            border: 2px solid #ccc;

        }

        .si {
            opacity: 0 !important;
        }

        .input-box i {
            position: absolute;
            right: -20px;
            /* وضع الأيقونة على اليمين */
            top: 39%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #888;
            transition: 0.3s;
        }

        @media screen and (max-width : 500px) {
            .input-box input {
                width: 100%;
            }

            .input-box i {
                right: 15px;
            }
        }

        .img-holder h1 {

            opacity: 0 !important;
        }
    </style>
</head>

<body>
    <div class="form-body form-left">
        <div class="iofrm-layout ">
            <div class="img-holder">
                <h1>شركة لاينافا للتوظيف</h1>
                <h1 style="size: 100px;">شركة لاينافا للتوظيف</h1>
                <div class="info-holder">
                    <img src="./img/img1.png" alt="">
                </div>
            </div>
            <div class="form-holder">
                <div class="form-content">
                    <div class="form-items">
                        <div class="website-logo-inside logo-normal">
                            <a href="https://brandio.io/envato/iofrm/html/index.html">
                                <div class="logo login-logo">
                                    <img class="logo-size" src="./iofrm_files/logo-salpink.svg" alt="">
                                </div>
                            </a>
                        </div>
                        <p class="si">أدخل بريدك الإلكتروني لإرسال رمز التحقق الخاص بك.</p>
                        <p class="si">أدخل بريدك الإلكتروني لإرسال رمز التحقق الخاص بك.</p>
                        <h3 class="font-md">هل نسيت كلمة المرور ؟</h3>
                        <p>أدخل بريدك الإلكتروني لإرسال رمز التحقق الخاص بك.</p>
                        <form id="login-form">
                            <div class="input-box ">
                                <i class='bx bx-envelope'></i>
                                <input class="form-contro" type="email" name="email" placeholder="أدخل بريدك الألكتروني"
                                    required="">
                            </div>


                            <div class="form-button ds d-flex">
                                <button id="submit" type="submit" class="btn btn-warning p-3 rounded-5 bu">أرسال
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 Script -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    $(document).ready(function () {
          if (!localStorage.getItem("token")) {
            window.location.href = "login.html";
        }
        $("#login-form").submit(function (event) {
            event.preventDefault();

            let email = $("input[name='email']").val(); // التقاط البريد الإلكتروني
            let submitButton = $("#submit");

            submitButton.prop("disabled", true).text("جارِ الإرسال...");

            $.ajax({
                url: "https://khaleiatnahel.com/beehive/api/sendOtp", // رابط الـ API
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ email: email }),
                success: function (response) {
                    if (response.status === true) { // ✅ إذا كان `status` يساوي `true`
                        Swal.fire({
                            icon: "success",
                            title: "تم الإرسال!",
                            text: response.message, // "تم ارسال الكود بنجاح"
                            confirmButtonColor: "#e1b13e"
                        });
                            
                            localStorage.setItem("previousPage", "forgot-password");
                        setTimeout(function () {
                            window.location.href = "otp-code.html";
                        }, 2000);

                    } else { // ❌ إذا كان `status` يساوي `false`
                        Swal.fire({
                            icon: "error",
                            title: "خطأ!",
                            text: response.message, // "البريد الالكتروني غير صحيح"
                            confirmButtonColor: "#e1b13e"
                        });
                    }
                },
                error: function () {
                    Swal.fire({
                        icon: "error",
                        title: "خطأ!",
                        text: "حدث خطأ، حاول مرة أخرى.",
                        confirmButtonColor: "#e1b13e"
                    });
                },
                complete: function () {
                    submitButton.prop("disabled", false).text("إرسال الرمز");
                }
            });
        });
    });
</script>





</body>

</html>
